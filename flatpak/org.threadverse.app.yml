app-id: org.threadverse.app
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: threadverse

finish-args:
  # Network access for API calls and real-time features
  - --share=network
  # Wayland + X11 fallback for broad display compatibility
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=x11
  # GPU acceleration for Electron rendering
  - --device=dri
  # Filesystem access for downloads and exports
  - --filesystem=xdg-download
  # IPC for Electron shared memory
  - --share=ipc
  # PulseAudio for future media features
  - --socket=pulseaudio
  # Notification support
  - --own-name=org.threadverse.app
  - --talk-name=org.freedesktop.Notifications

modules:
  - name: threadverse
    buildsystem: simple
    build-commands:
      # Install AppImage contents
      - chmod +x ThreadVerse.AppImage
      - ./ThreadVerse.AppImage --appimage-extract > /dev/null 2>&1 || true

      # Install binary wrapper
      - install -Dm755 threadverse /app/bin/threadverse

      # Install desktop file
      - install -Dm644 org.threadverse.app.desktop /app/share/applications/org.threadverse.app.desktop

      # Install AppStream metadata
      - install -Dm644 org.threadverse.app.metainfo.xml /app/share/metainfo/org.threadverse.app.metainfo.xml

      # Install icons — Flathub requires SVG at minimum, plus PNGs
      - install -Dm644 icons/128x128.png /app/share/icons/hicolor/128x128/apps/org.threadverse.app.png
      - install -Dm644 icons/256x256.png /app/share/icons/hicolor/256x256/apps/org.threadverse.app.png
      - install -Dm644 icons/512x512.png /app/share/icons/hicolor/512x512/apps/org.threadverse.app.png

    sources:
      # AppImage from GitHub Releases (update URL per release)
      - type: file
        url: https://github.com/anu-xo/Final-Thread/releases/download/v1.0.0/ThreadVerse-1.0.0.AppImage
        sha256: REPLACE_WITH_ACTUAL_SHA256

      # Desktop entry
      - type: file
        path: org.threadverse.app.desktop

      # AppStream metadata
      - type: file
        path: org.threadverse.app.metainfo.xml

      # Icons (copied from build-assets)
      - type: dir
        path: icons
