name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, staging]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password123
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system dependencies (Electron)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libgtk-3-0 libgbm1 libdrm2 \
            libnss3 libnspr4 libatk-bridge2.0-0 \
            libasound2 libxkbcommon-x11-0 libxcomposite1 \
            libxdamage1 libxrandr2 libgbm1 libpango-1.0-0 \
            libcairo2 libatk1.0-0 libgdk-pixbuf2.0-0 \
            libxfixes3 libcups2 libxshmfence1

      - name: Lint (web)
        run: pnpm --filter web exec eslint src --ext .js,.jsx || true

      - name: Test (server)
        env:
          MONGODB_URI: mongodb://admin:password123@localhost:27017/threadverse_test?authSource=admin
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret
          NODE_ENV: test
        run: pnpm --filter server test

      - name: Build applications
        run: pnpm --filter web build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # ── Web flow tests (Chromium) ─────────────────────────────────────

      - name: Core user flow (web)
        run: |
          pnpm exec playwright test \
            --project=core-flows \
            --reporter=list

      - name: Moderation flow (web)
        run: |
          pnpm exec playwright test \
            --project=moderation-flows \
            --reporter=list

      - name: Social flow (web)
        run: |
          pnpm exec playwright test \
            --project=social-flows \
            --reporter=list

      # ── Electron flow tests ───────────────────────────────────────────

      - name: Verify Electron binary exists
        id: electron_check
        run: |
          ELECTRON_BIN=$(find node_modules/.pnpm -path '*/electron/dist/electron' -type f 2>/dev/null | head -1)
          if [ -n "$ELECTRON_BIN" ]; then
            echo "electron_found=true" >> $GITHUB_OUTPUT
            echo "Electron binary found at: $ELECTRON_BIN"
          else
            echo "electron_found=false" >> $GITHUB_OUTPUT
            echo "Electron binary NOT found"
          fi

      - name: Core user flow (Electron)
        if: steps.electron_check.outputs.electron_found == 'true'
        run: |
          xvfb-run --auto-servernum \
            pnpm exec playwright test \
              --project=core-flows-electron \
              --reporter=list
        timeout-minutes: 10

      - name: Moderation flow (Electron)
        if: steps.electron_check.outputs.electron_found == 'true'
        run: |
          xvfb-run --auto-servernum \
            pnpm exec playwright test \
              --project=moderation-flows-electron \
              --reporter=list
        timeout-minutes: 10

      - name: Social flow (Electron)
        if: steps.electron_check.outputs.electron_found == 'true'
        run: |
          xvfb-run --auto-servernum \
            pnpm exec playwright test \
              --project=social-flows-electron \
              --reporter=list
        timeout-minutes: 10

      # ── Upload results ────────────────────────────────────────────────

      - name: Upload flow test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-tests-ci
          path: test-results/
          retention-days: 14

      - name: Font rendering audit
        run: |
          pnpm exec playwright test \
            e2e/tests/font-rendering.spec.js \
            --project=web \
            --reporter=list

      - name: Upload font audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-audit-ci
          path: test-results/
          retention-days: 14

      - name: Titlebar/tray audit
        run: |
          pnpm exec playwright test \
            e2e/tests/titlebar-tray-audit.spec.js \
            --project=titlebar-tray-audit \
            --reporter=list

      - name: Upload titlebar/tray audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titlebar-tray-audit-ci
          path: test-results/
          retention-days: 14

  # ── Required status check: all 6 flows pass before merge ────────────
  e2e-required:
    needs: [lint-test-build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all flow results
        run: |
          echo "All E2E flow checks passed:"
          echo "  ✅ Core flow (web)"
          echo "  ✅ Core flow (Electron)"
          echo "  ✅ Moderation flow (web)"
          echo "  ✅ Moderation flow (Electron)"
          echo "  ✅ Social flow (web)"
          echo "  ✅ Social flow (Electron)"
