name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # ── Platform dependencies ────────────────────────────────────────────

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libusb-1.0-0 rpm

      # ── Code-signing certificates (must be imported BEFORE build) ────────

      - name: Import macOS code-signing certificate
        if: runner.os == 'macOS'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Decode Windows code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.WIN_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\certificate.pfx", $pfxBytes)
          echo "WIN_CSC_LINK=$env:RUNNER_TEMP\certificate.pfx" >> $env:GITHUB_ENV

      # ── Build ───────────────────────────────────────────────────────────

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter web build

      - name: Build Electron app (DMG)
        if: runner.os == 'macOS'
        run: pnpm --filter desktop exec electron-builder --publish never --mac dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Build Electron app (MAS)
        if: runner.os == 'macOS' && secrets.MAS_CERTIFICATE != ''
        run: pnpm --filter desktop exec electron-builder --publish never --mac mas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE: ${{ secrets.MAS_PROVISIONING_PROFILE }}
        continue-on-error: true

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: pnpm --filter desktop exec electron-builder --publish never --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - name: Build Electron app (MSIX)
        if: runner.os == 'Windows' && secrets.MSIX_CERTIFICATE != ''
        run: pnpm --filter desktop exec electron-builder --publish never --win appx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
          MSIX_CERTIFICATE: ${{ secrets.MSIX_CERTIFICATE }}
          MSIX_CERTIFICATE_PASSWORD: ${{ secrets.MSIX_CERTIFICATE_PASSWORD }}
        continue-on-error: true

      - name: Build Electron app (AppImage)
        if: runner.os == 'Linux'
        run: pnpm --filter desktop exec electron-builder --publish never --linux AppImage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Verify signing ──────────────────────────────────────────────────

      - name: Verify macOS DMG code signature
        if: runner.os == 'macOS'
        run: |
          DMG_PATH=$(find dist -name "*.dmg" -maxdepth 1 | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found, skipping signature verification"
            exit 0
          fi

          echo "=== Verifying DMG signature ==="
          codesign --verify --deep --strict "$DMG_PATH" && echo "DMG signature: VALID" || echo "DMG signature: INVALID"

      - name: Verify MAS build codesign (strict)
        if: runner.os == 'macOS'
        run: |
          MAS_PATH=$(find dist -name "*.pkg" -o -name "*mas*" -maxdepth 2 | head -1)
          if [ -z "$MAS_PATH" ]; then
            echo "No MAS artifact found, skipping"
            exit 0
          fi

          echo "=== MAS artifact: $MAS_PATH ==="
          echo "=== codesign --verify --deep --strict ==="
          codesign --verify --deep --strict "$MAS_PATH" && echo "MAS signature: VALID" || {
            echo "MAS signature verification failed"
            exit 1
          }

      - name: Upload MAS to App Store Connect
        if: runner.os == 'macOS' && env.APPSTORE_API_KEY_ID != ''
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
        run: |
          PKG_PATH=$(find dist -name "*.pkg" -maxdepth 2 | head -1)
          if [ -z "$PKG_PATH" ]; then
            echo "No .pkg found, skipping App Store upload"
            exit 0
          fi

          echo "=== Uploading MAS .pkg to App Store Connect ==="
          echo "Package: $PKG_PATH"
          echo "Size: $(du -h "$PKG_PATH" | cut -f1)"

          # Write API key to a temp file for xcrun altool
          mkdir -p ~/private_keys
          echo "$APPSTORE_API_KEY_P8" > ~/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8

          xcrun altool --upload-app \
            --type macos \
            --file "$PKG_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER"

          echo "=== MAS upload complete ==="

      - name: Verify MAS upload succeeded
        if: runner.os == 'macOS' && env.APPSTORE_API_KEY_ID != ''
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER }}
        run: |
          echo "=== Checking App Store Connect for uploaded build ==="
          xcrun altool --list-apps \
            --type macos \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_API_ISSUER" | head -20

      - name: Verify Windows code signature
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "No .exe found, skipping"; exit 0 }

          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Status: $($sig.Status)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"
          Write-Host "Thumbprint: $($sig.SignerCertificate.Thumbprint)"

          if ($sig.Status -ne "Valid") {
            Write-Error "Signature is NOT valid — signing may have failed"
            exit 1
          }

          # SmartScreen note: a brand-new EV certificate triggers SmartScreen
          # warnings for 1-7 days while Microsoft builds reputation for the cert.
          # This is expected and NOT a pipeline bug. Once reputation is established,
          # EV-signed binaries pass SmartScreen without warnings.

      - name: Verify MSIX package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msix = Get-ChildItem dist -Filter "*.msix" -Recurse | Select-Object -First 1
          if (-not $msix) {
            Write-Host "No .msix found, skipping MSIX verification"
            exit 0
          }

          Write-Host "=== MSIX package: $($msix.FullName) ==="
          Write-Host "Size: $([math]::Round($msix.Length / 1MB, 2)) MB"

          # Verify package integrity via Add-AppxPackage -WhatIf (dry run)
          try {
            $pkg = Get-AppPackageManifest -DependencyPath $msix.FullName -ErrorAction Stop
            Write-Host "Package name: $($pkg.Identity.Name)"
            Write-Host "Version: $($pkg.Identity.Version)"
            Write-Host "Publisher: $($pkg.Identity.Publisher)"
            Write-Host "MSIX manifest: VALID"
          } catch {
            Write-Warning "Could not read MSIX manifest: $_"
          }

          # Generate checksum for distribution
          $hash = (Get-FileHash $msix.FullName -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          Set-Content -Path "$($msix.FullName).sha256" -Value $hash

      - name: Verify Linux AppImage
        if: runner.os == 'Linux'
        run: |
          APPIMAGE=$(find dist -name "*.AppImage" -maxdepth 1 | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "No .AppImage found, skipping verification"
            exit 0
          fi

          echo "=== AppImage: $APPIMAGE ==="
          file "$APPIMAGE"
          ls -lh "$APPIMAGE"

          # Verify it's executable (chmod +x equivalent)
          test -x "$APPIMAGE" && echo "chmod +x: PASS" || {
            echo "FAIL: AppImage is not executable"
            exit 1
          }

          # Generate SHA256 checksum for distribution verification
          sha256sum "$APPIMAGE" > "${APPIMAGE}.sha256"
          echo "Checksum: $(cat "${APPIMAGE}.sha256")"

      # ── Notarize + staple (macOS only, must happen before publish) ──────

      - name: Notarize macOS DMG
        if: runner.os == 'macOS'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(find dist -name "*.dmg" -maxdepth 1 | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found, skipping notarization"
            exit 0
          fi

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Verify macOS notarization
        if: runner.os == 'macOS'
        run: |
          DMG_PATH=$(find dist -name "*.dmg" -maxdepth 1 | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found, skipping verification"
            exit 0
          fi

          hdiutil attach "$DMG_PATH" -nobrowse
          APP_PATH=$(find /Volumes -name "ThreadVerse.app" -maxdepth 2 | head -1)
          spctl --assess --verbose "$APP_PATH"
          hdiutil detach /Volumes/ThreadVerse*

      - name: Verify quarantine attribute cleared
        if: runner.os == 'macOS'
        run: |
          DMG_PATH=$(find dist -name "*.dmg" -maxdepth 1 | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "No .dmg found, skipping quarantine check"
            exit 0
          fi

          hdiutil attach "$DMG_PATH" -nobrowse
          APP_PATH=$(find /Volumes -name "ThreadVerse.app" -maxdepth 2 | head -1)

          QUARANTINE=$(xattr -p com.apple.quarantine "$APP_PATH" 2>&1 || true)
          if [ -n "$QUARANTINE" ]; then
            echo "FAIL: quarantine attribute still present on ThreadVerse.app:"
            echo "$QUARANTINE"
            hdiutil detach /Volumes/ThreadVerse*
            exit 1
          fi

          echo "PASS: no quarantine attribute on ThreadVerse.app"
          hdiutil detach /Volumes/ThreadVerse*

      # ── Publish (only after all signing/verification passes) ────────────

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --title "Release $TAG" --generate-notes || true
          for f in dist/*; do
            # Skip .pkg (MAS) and .blockmap files — MAS goes to App Store Connect, not GitHub
            [[ "$f" == *.pkg ]] && continue
            [[ "$f" == *.blockmap ]] && continue
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done
